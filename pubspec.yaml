name: expense_tracker
description: "A modern Flutter app to track daily income and expenses with beautiful animations and UI."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.19.0  # For date formatting
  uuid: ^4.0.0   # For unique transaction IDs
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Uncomment to add assets (for future background images/videos)
  # assets:
  #   - assets/images/
  #   - assets/videos/

  # Custom fonts for premium look
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
